# Blue Abyss — Worlds
# ---------------------------------------------------------------------------
# Editable at Admin > Customize > Themes > Blue Abyss > Settings. Anything
# changed here applies immediately, with no deploy.

world_icons:
  type: string
  default: "book-open|brain|hands-praying|earth-americas|landmark|bullhorn|gavel|scale-balanced|chart-line|user-group|people-group|water|sliders|shield-halved"
  description:
    en: >
      Marks this theme needs in the SVG sprite. Discourse adds the values of
      any setting whose name contains "_icon" to the sprite, which is the
      supported way for a theme to ship glyphs — and it already registers the
      icons categories carry, so this really only has to cover "book-open"
      (the Rules glyph, which no category uses) and the fallbacks in
      javascripts/discourse/lib/worlds.js. Extras are harmless: scale-balanced
      is listed so it is available if Law ever switches from a gavel to
      scales. Pipe-separated.

enable_masthead:
  type: bool
  default: true
  description:
    en: "Show the world banner at the top of category pages."

enable_identity_bar:
  type: bool
  default: true
  description:
    en: >
      Name the world above the topic title, larger than the title itself, and
      give the world prominence in Discourse's own sticky header on scroll.

# ── The law: OFF until the charters are ratified ──────────────────────────
# Identity ships first. The rule text in lib/rules.js is a draft, and the
# moment these are on it reads to members as forum law. Turn them on — in this
# order — once the charters have been through Meta.

enable_rules_button:
  type: bool
  default: false
  description:
    en: >
      Show the floating Rules button, and the overlay it opens. Turn this on
      once the charters in lib/rules.js are the forum's, not a draft.

enable_composer_nudge:
  type: bool
  default: false
  description:
    en: >
      Show one line of the world's rules above the composer. Turn this on
      after the Rules button, once the short forms read well.

auto_open_rules:
  type: bool
  default: false
  description:
    en: >
      Open a world's rules automatically the first time a member enters it —
      once per world, per member, per rules version. Turn this on LAST: the
      "seen" flag burns on first sight, so a member who meets the wrong text
      has met it. (Bumping RULES_VERSION does re-show every world.) Stored in
      the browser, so a member on a second device sees each world once more.

hide_default_categories_section:
  type: bool
  default: false
  description:
    en: >
      Hide Discourse's own "Categories" section in the sidebar, leaving Worlds
      as the only map. Leave this off until members have found the new section.

switcher_heading:
  type: string
  default: "Worlds"
  description:
    en: "Heading for the sidebar section."

rules_override:
  type: string
  default: ""
  textarea: true
  description:
    en: >
      Optional JSON, keyed by category slug, merged over the drafts in
      javascripts/discourse/lib/rules.js. Use it to fix a rule now and commit
      it properly later. Example:
      {"mainstream-politics":{"short":"The op-ed test","standard":"..."}}
      Invalid JSON is ignored and logged to the console.
